name: Release

on:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    checks:
        uses: ./.github/workflows/check.yaml

    linux:
        name: Linux ${{ matrix.arch }}
        needs: checks
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      arch: amd64
                    - runner: ubuntu-24.04-arm
                      arch: arm64
        runs-on: ${{ matrix.runner }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7.0.1
            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  key: linux-${{ matrix.arch }}
            - name: Install cargo-deb
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-deb@3.8.0
            - name: Build Debian package
              env:
                  ARCH: ${{ matrix.arch }}
                  VERSION: ${{ needs.checks.outputs.version }}
              run: |
                  set -euo pipefail
                  cargo build --release --locked
                  ./target/release/evm-bot --version
                  cargo deb --no-build

                  mkdir -p dist
                  package="evm-bot_${VERSION}_${ARCH}.deb"
                  generated=$(find target/debian -maxdepth 1 -name '*.deb' -print -quit)
                  mv "$generated" "dist/$package"
                  (cd dist && sha256sum "$package" > "$package.sha256")
            - name: Upload Linux package
              uses: actions/upload-artifact@v4
              with:
                  name: linux-${{ matrix.arch }}
                  path: dist/*
                  if-no-files-found: error

    macos:
        name: macOS ${{ matrix.arch }}
        needs: checks
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15-intel
                      target: x86_64-apple-darwin
                      arch: amd64
                    - runner: macos-15
                      target: aarch64-apple-darwin
                      arch: arm64
        runs-on: ${{ matrix.runner }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7.0.1
            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  key: macos-${{ matrix.arch }}
            - name: Build macOS archive
              env:
                  ARCH: ${{ matrix.arch }}
                  TARGET: ${{ matrix.target }}
                  VERSION: ${{ needs.checks.outputs.version }}
              run: |
                  set -euo pipefail
                  cargo build --release --locked --target "$TARGET"
                  "target/$TARGET/release/evm-bot" --version

                  archive="evm-bot-v${VERSION}-darwin-${ARCH}.tar.gz"
                  mkdir -p dist stage
                  cp "target/$TARGET/release/evm-bot" README.md CONTRIBUTING.md LICENSE stage/
                  tar -C stage -czf "dist/$archive" evm-bot README.md CONTRIBUTING.md LICENSE
                  (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
            - name: Upload macOS archive
              uses: actions/upload-artifact@v4
              with:
                  name: macos-${{ matrix.arch }}
                  path: dist/*
                  if-no-files-found: error

    windows:
        name: Windows ${{ matrix.arch }}
        needs: checks
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: windows-latest
                      target: x86_64-pc-windows-msvc
                      arch: amd64
                    - runner: windows-11-arm
                      target: aarch64-pc-windows-msvc
                      arch: arm64
        runs-on: ${{ matrix.runner }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7.0.1
            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  key: windows-${{ matrix.arch }}
            - name: Build Windows archive
              shell: pwsh
              env:
                  ARCH: ${{ matrix.arch }}
                  TARGET: ${{ matrix.target }}
                  VERSION: ${{ needs.checks.outputs.version }}
              run: |
                  $ErrorActionPreference = "Stop"
                  cargo build --release --locked --target $env:TARGET
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  & "target/$($env:TARGET)/release/evm-bot.exe" --version
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

                  $archive = "evm-bot-v$($env:VERSION)-windows-$($env:ARCH).zip"
                  New-Item -ItemType Directory -Force -Path dist, stage | Out-Null
                  Copy-Item "target/$($env:TARGET)/release/evm-bot.exe", README.md, CONTRIBUTING.md, LICENSE -Destination stage
                  Compress-Archive -Path "stage/*" -DestinationPath "dist/$archive"
                  $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$hash  $archive" | Out-File "dist/$archive.sha256" -Encoding ascii
            - name: Upload Windows archive
              uses: actions/upload-artifact@v4
              with:
                  name: windows-${{ matrix.arch }}
                  path: dist/*
                  if-no-files-found: error

    publish:
        name: Publish crate
        needs: [checks, linux, macos, windows]
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7.0.1
            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
            - name: Publish to crates.io
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
                  VERSION: ${{ needs.checks.outputs.version }}
              run: |
                  if cargo info --registry crates-io "evm-bot@$VERSION" >/dev/null 2>&1; then
                    echo "Crate evm-bot@$VERSION already exists."
                  else
                    cargo publish --locked
                  fi

    release:
        name: Publish GitHub release
        needs: [checks, linux, macos, windows, publish]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Check out repository
              uses: actions/checkout@v7.0.1
            - name: Download release assets
              uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  VERSION: ${{ needs.checks.outputs.version }}
              run: |
                  set -euo pipefail
                  tag="v$VERSION"
                  if ! gh release view "$tag" >/dev/null 2>&1; then
                    gh release create "$tag" \
                      --target "$GITHUB_SHA" \
                      --title "$tag" \
                      --generate-notes
                  fi
                  gh release upload "$tag" dist/* --clobber
