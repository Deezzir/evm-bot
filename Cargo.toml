[package]
name = "evm-bot"
version = "0.1.0"
authors = ["Deezzir <deezzir@gmail.com>"]
description = "EVM Bot CLI"
edition = "2024"

[dependencies]
alloy = { version = "0.1", features = [
    "network",
    "provider-http",
    "provider-ws",
    "rpc-types-eth",
    "signer-local",
    "contract",
    "reqwest",
] }

tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
csv = "1.4"
figlet-rs = "1.0"
colored = "2"
dotenv = "0.15"
chrono = "0.4.45"
anyhow = "1.0.104"
serde_json = "1.0.151"
reqwest = { version = "0.13.4", features = ["json", "query"] }
num-format = "0.4.4"
futures = "0.3.34"
